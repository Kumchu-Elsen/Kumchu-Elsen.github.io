<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Unit 6 Test Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: unit header, lesson strip, concept ring, then a two-panel workbench (explanation | live picture) */
:root{
  --bg:#f3f5f9;--panel:#ffffff;--sunk:#eceff6;--fg:#1a2032;--muted:#5a6379;--line:#d9deea;
  --accent:#2747c9;--on-accent:#ffffff;--accent-soft:#e5eaff;--amber:#c97412;--amber-soft:#fcefd9;
  --ok:#1b7f45;--ok-soft:#e0f2e7;--bad:#c22f2f;--bad-soft:#fbe5e5;--warn:#9a620e;--warn-soft:#fbefd8;
  --c1:#2747c9;--c2:#d4800f;--c3:#0f8a75;--c4:#be3a75;--c5:#7452e0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220;--panel:#161b2b;--sunk:#1d2336;--fg:#e5e8f1;--muted:#9aa3b8;--line:#2b3247;
  --accent:#8099ff;--on-accent:#0e1220;--accent-soft:#232c4f;--amber:#f0a447;--amber-soft:#3a2c17;
  --ok:#52c48a;--ok-soft:#173326;--bad:#ff7d7d;--bad-soft:#3d1d22;--warn:#e8b462;--warn-soft:#3a2f18;
  --c1:#8099ff;--c2:#f0a447;--c3:#43c9b0;--c4:#f07fb1;--c5:#ab95ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220;--panel:#161b2b;--sunk:#1d2336;--fg:#e5e8f1;--muted:#9aa3b8;--line:#2b3247;
  --accent:#8099ff;--on-accent:#0e1220;--accent-soft:#232c4f;--amber:#f0a447;--amber-soft:#3a2c17;
  --ok:#52c48a;--ok-soft:#173326;--bad:#ff7d7d;--bad-soft:#3d1d22;--warn:#e8b462;--warn-soft:#3a2f18;
  --c1:#8099ff;--c2:#f0a447;--c3:#43c9b0;--c4:#f07fb1;--c5:#ab95ff;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:1380px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .cap{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 13px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,.lchip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.sm{padding:4px 9px;font-size:13px}
.in{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font-variant-numeric:tabular-nums}
.in.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)} .in.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
select.in{max-width:100%}
/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.brand h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.brand .unit{font-family:var(--display);font-weight:500;color:var(--accent)}
.idchip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--panel)}
/* lesson strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lchip{flex:0 0 auto;font:inherit;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:150px}
.lchip .code{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lchip .t{font-weight:700;font-size:14px}
.lchip .pb{height:4px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:4px}
.lchip .pb i{display:block;height:100%;background:var(--ok)}
.lchip[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
/* ring */
.ringrow{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.ringbox{width:250px;max-width:100%;flex:0 0 auto}
.ringbox svg{display:block;width:100%;height:auto}
.ringinfo{flex:1 1 20rem;min-width:0;display:flex;flex-direction:column;gap:8px}
.ringinfo h2{font-size:24px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid}
/* workbench */
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,27rem),1fr));gap:14px;align-items:start}
.lefthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--sunk)}
.seg button{font:inherit;font-size:14px;cursor:pointer;border:0;border-radius:999px;padding:7px 18px;background:transparent;color:var(--muted)}
.seg button[aria-selected=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.stepno{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ctitle{font-size:26px;font-weight:700;margin:2px 0 10px}
.p{margin:0 0 10px;max-width:68ch}
.key{border-left:4px solid var(--accent);background:var(--accent-soft);padding:9px 13px;border-radius:0 8px 8px 0;margin:6px 0 14px;font-weight:700}
.sec{margin-top:14px} .sec h3{font-size:17px;margin-bottom:6px}
.lines{margin:6px 0 0;padding-left:18px} .lines li{margin:3px 0}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.tw{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px;min-width:100%}
.tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:700;font-size:12.5px}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl td.hi{background:var(--amber-soft);font-weight:700}
.tbl td.ok{color:var(--ok);font-weight:700} .tbl td.bad{color:var(--bad);font-weight:700}
.pt th,.pt td{text-align:center}
.pt th:first-child,.pt td:first-child{text-align:left}
.pt .on{background:var(--accent-soft)}
.pt td.hl .cand{box-shadow:0 0 0 3px var(--amber)}
.cand{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;font-weight:700;font-size:13px;color:var(--panel);background:var(--cc,var(--c1))}
.cand.off{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.cand.ghost{background:transparent;color:var(--cc);border:2px solid var(--cc)}
/* try */
.try{border:1.5px dashed var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.prompt{font-weight:700;font-size:16px;line-height:1.45}
.fb{border-radius:8px;padding:9px 13px;border-left:4px solid;line-height:1.5}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)} .fb.bad{border-color:var(--bad);background:var(--bad-soft)} .fb.info{border-color:var(--accent);background:var(--accent-soft)}
.fb b{font-weight:700} .fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
.choice.right{border-color:var(--ok)!important;color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.choice.wrong{border-color:var(--bad)!important;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
/* right */
.rhead h2{font-size:19px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.note{font-size:13px;color:var(--amber);font-weight:700}
.vis{position:relative;min-height:240px}
.vis svg{display:block;overflow:visible;max-width:100%}
.vis svg text{font-family:var(--body);font-size:12px;fill:var(--muted)}
.vis svg text.lbl{fill:var(--fg)} .vis svg text.strong{fill:var(--fg);font-weight:700}
.vis svg .grid line{stroke:var(--line)}
.readout{margin-top:10px;padding:10px 13px;border-radius:8px;background:var(--sunk);line-height:1.55;font-variant-numeric:tabular-nums}
.good{color:var(--ok);font-weight:700} .warnt{color:var(--bad);font-weight:700}
.range{width:100%;accent-color:var(--accent)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:6px 10px;font-size:12.5px;display:none;z-index:5;white-space:nowrap}
.tip .s{color:var(--muted)}
.edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--sunk)}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.edit .pair{display:flex;gap:5px}
.edit input{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);min-width:0;width:100%}
.ballots{display:flex;flex-wrap:wrap;gap:8px}
.ballot{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 8px 7px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:46px}
.ballot .no{font-size:11px;color:var(--muted)}
.stacks{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.stack .pile{position:relative;width:62px}
.stack .count{font-family:var(--display);font-size:22px;font-weight:700}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mcard .w{font-family:var(--display);font-size:22px;font-weight:700}
/* sign in / home / report */
.signin{max-width:32rem;margin:6vh auto 0;width:100%;display:flex;flex-direction:column;gap:12px;padding:28px}
.signin h1{font-size:30px}
.signin .in{font-size:22px;letter-spacing:.1em;width:100%;font-family:var(--mono)}
.err{color:var(--bad);font-size:13.5px;min-height:1.3em}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.lcard:hover{border-color:var(--accent)}
.lcard h3{font-size:19px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px}
.sechead h2{font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:10px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.pill.m{background:var(--ok);color:var(--panel)} .pill.d{background:var(--ok-soft);color:var(--ok)} .pill.s{background:var(--warn-soft);color:var(--warn)} .pill.n{background:var(--sunk);color:var(--muted)}
.log{max-height:240px;overflow:auto;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:12px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:6px;font-family:var(--mono);font-size:13px}
.idgrid span{border:1px solid var(--line);border-radius:6px;padding:3px 8px;text-align:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--bad);border-radius:8px;background:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{opacity:.001;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
<style>
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.clock{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.warn{color:var(--warn)} .clock.bad{color:var(--bad)}
.leaves{font-size:13px;font-weight:700;border-radius:999px;padding:4px 11px;background:var(--sunk);color:var(--muted)}
.leaves.on{background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font:inherit;font-size:13px;font-weight:700;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.dot.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.dot.out{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.dot.tried{border-color:var(--warn);background:var(--warn-soft)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:14px;align-items:start}
.qnum{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.tries{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--muted)}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.tries i.used{background:var(--bad)} .tries i.okd{background:var(--ok)}
.scratch{width:100%;min-height:260px;font:inherit;font-family:var(--mono);font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);resize:vertical}
.alert{border-radius:var(--r);padding:12px 16px;border:1.5px solid var(--bad);background:var(--bad-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.alert b{color:var(--bad)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.code{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.06em;padding:12px 16px;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);display:inline-block;user-select:all}
.cover{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;padding:16px}
.cover .card{max-width:30rem;display:flex;flex-direction:column;gap:12px;text-align:left}
.wtbl th[scope=row]{text-align:left;font-weight:700;color:var(--fg);font-size:13px;white-space:normal;min-width:9rem}
.wtbl td{padding:4px 5px}
.qgrid.wide{grid-template-columns:1fr}
.wcell{font:inherit;font-size:13.5px;width:5.6rem;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.wcell:focus{outline:2px solid var(--accent);outline-offset:0}
.wtbl td.pre{color:var(--muted);font-weight:700}
.wtbl td.ro{min-width:4rem}
.wtbl td.tot{font-weight:700;color:var(--accent);background:var(--sunk);min-width:4.5rem}
.wtbl tr.fin th,.wtbl tr.fin td{background:var(--accent-soft)}
.divin{display:flex;flex-direction:column;gap:3px}
.scratch{min-height:110px}
.hb{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.hbr{display:grid;grid-template-columns:minmax(6rem,14rem) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden}
.hbt i{display:block;height:100%;border-radius:7px}
.hbv{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.hbr{grid-template-columns:1fr auto}.hbt{grid-column:1/-1;grid-row:2}}
.wtbl tr.choose td{background:var(--amber-soft);text-align:left}
.tscore{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.tsv{font-family:var(--display);font-size:20px;font-weight:700}
.roval{display:inline-block;min-width:3.5rem;padding:3px 6px;border-radius:5px;text-align:right}
.roval.mok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.roval.mbad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.choice.triedc{text-decoration:line-through}
</style></head>

<div class="app">

</div>
<div class="cover" id="cover" hidden></div>
<script>

function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.setAttribute('style',v);else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}kids.flat(4).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)));});return e;}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);return e;}
const fInt=d3.format(','),f2=d3.format(',.2f'),fPct=d3.format('.0%'),f1p=d3.format('.2f');
const fmtN=v=>Math.abs(v-Math.round(v))<1e-9?fInt(Math.round(v)):f2(v);
const fHalf=v=>Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):(Math.floor(v)?Math.floor(v)+'½':'½');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const ORD=['First','Second','Third','Fourth','Fifth'];
const CC=i=>`var(--c${(i%5)+1})`;
function perms(a){if(a.length<=1)return[a.slice()];const o=[];a.forEach((x,i)=>perms(a.filter((_,j)=>j!==i)).forEach(p=>o.push([x,...p])));return o;}

/* ================= VOTING ENGINE ================= */
const total=sc=>d3.sum(sc.cols,c=>c.n);
const majOf=N=>Math.floor(N/2)+1;
const cname=(sc,c)=>sc.names&&sc.names[c]&&!/^Candidate |^Brand |^Finalist /.test(sc.names[c])?`${c} (${sc.names[c]})`:c;
function firsts(sc,act,cols){cols=cols||sc.cols;const t={};act.forEach(c=>t[c]=0);cols.forEach(col=>{const f=col.r.find(x=>act.includes(x));if(f)t[f]+=col.n;});return t;}
function topOf(t,act){const mx=d3.max(act,c=>t[c]);return act.filter(c=>t[c]===mx);}
function plurality(sc,act,cols){act=act||sc.cands;const t=firsts(sc,act,cols);return{t,win:topOf(t,act)};}
function borda(sc){const k=sc.cands.length,t={};sc.cands.forEach(c=>t[c]=0);sc.cols.forEach(col=>col.r.forEach((c,i)=>{t[c]+=col.n*(k-i);}));return{t,k,win:topOf(t,sc.cands)};}
function elimination(sc,cols){cols=cols||sc.cols;let act=sc.cands.slice();const N=d3.sum(cols,c=>c.n),rounds=[];
  for(let g=0;g<10;g++){const t=firsts(sc,act,cols);const w=act.filter(c=>t[c]>N/2);const mn=d3.min(act,c=>t[c]);const out=w.length?[]:act.filter(c=>t[c]===mn);
    rounds.push({act:act.slice(),t,w:w[0]||null,out});if(w.length)return{rounds,win:[w[0]]};if(out.length===act.length)return{rounds,win:act.slice()};
    act=act.filter(c=>!out.includes(c));if(act.length===1){rounds.push({act:act.slice(),t:firsts(sc,act,cols),w:act[0],out:[]});return{rounds,win:act.slice()};}}
  return{rounds,win:[]};}
function prefCount(sc,x,y,cols){return d3.sum((cols||sc.cols).filter(c=>c.r.indexOf(x)<c.r.indexOf(y)),c=>c.n);}

function candChip(sc,c,cls){const i=(sc.allCands||sc.cands).indexOf(c);const e=h('span',{class:'cand'+(cls?' '+cls:''),title:(sc.names&&sc.names[c])||c,text:c});e.style.setProperty('--cc',CC(i<0?0:i));return e;}
function prefTable(sc,o={}){const cols=o.cols||sc.cols,rm=o.removed||[],k=sc.cands.length-rm.length,base={...sc,allCands:sc.allCands||sc.cands};
  const colOn=(c)=>o.cmp?c.r.indexOf(o.cmp[0])<c.r.indexOf(o.cmp[1]):false;
  const t=h('table',{class:'tbl pt'});
  t.append(h('thead',null,h('tr',null,h('th',{text:'Number of votes'}),cols.map(c=>h('th',{class:colOn(c)?'on':null,text:c.n})))));
  const tb=h('tbody');for(let i=0;i<k;i++){tb.append(h('tr',null,h('td',{text:(o.points?`${ORD[i]}: ${k-i} pt${k-i===1?'':'s'}`:`${ORD[i]} choice`)}),cols.map(c=>{const r=c.r.filter(x=>!rm.includes(x)),x=r[i];

  t.append(tb);return h('div',{class:'tw'},t);}
function tbl(cols,rows,tot){const t=h('table',{class:'tbl'});t.append(h('thead',null,h('tr',null,cols.map(c=>h('th',{text:c.h})))));
  const tb=h('tbody');rows.forEach(r=>tb.append(h('tr',null,cols.map(c=>{const v=c.f(r);return h('td',{class:c.cls?c.cls(r)||null:null},v&&v.nodeType?v:String(v??''));}))));
  if(tot)tb.append(h('tr',{class:'tot'},cols.map((c,i)=>h('td',{text:tot[i]??''}))));t.append(tb);return h('div',{class:'tw'},t);}
const ul=a=>h('ul',{class:'lines'},a.filter(Boolean).map(x=>h('li',null,x)));
function popTable(sc){return tbl([{h:'Group',f:r=>r.name},{h:`Population (${sc.unit})`,f:r=>fInt(r.pop)}],sc.states,['Items to share',sc.seats]);}
function ballotGrid(sc,limit){const b=ballotsOf(sc).slice(0,limit||60);return h('div',{class:'ballots'},b.map((r,i)=>h('div',{class:'ballot'},h('span',{class:'no',text:'#'+(i+1)}),r.map(c=>candChip(sc,c)))));}
function scenView(sc,q){if(sc.kind==='vote'){if(q&&/^ballot_/.test(q.qt))return ballotGrid(sc);

  if(sc.after)return tbl([{h:'State',f:r=>r.name},{h:'Original',f:r=>fInt(r.pop)},{h:'New',f:r=>fInt(sc.after[r.i])}],sc.states.map((s,i)=>({...s,i})),['Seats',sc.seats,sc.seats]);
